<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
</head>
<body>
    <h1>Cadastro de Cliente</h1>

    <form id="formCadastro">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco" required><br><br>

        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" name="telefone" required><br><br>

        <label for="numero_compras">Número de Compras:</label>
        <input type="number" id="numero_compras" name="numero_compras" required><br><br>

        <label for="dados1">Dados 1:</label>
        <input type="text" id="dados1" name="dados1" required><br><br>

        <label for="dados2">Dados 2:</label>
        <input type="text" id="dados2" name="dados2" required><br><br>

        <label for="dados3">Dados 3:</label>
        <input type="text" id="dados3" name="dados3" required><br><br>

        <label for="restaurante">Escolha o Restaurante:</label>
        <select id="restaurante" name="restaurante">
            <option value="restauranteA">Restaurante A</option>
            <option value="restauranteB">Restaurante B</option>
            <option value="restauranteC">Restaurante C</option>
        </select><br><br>

        <button type="submit">Cadastrar Cliente</button>
    </form>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(e) {
            e.preventDefault();

            const nome = document.getElementById('nome').value;
            const endereco = document.getElementById('endereco').value;
            const telefone = document.getElementById('telefone').value;
            const numero_compras = document.getElementById('numero_compras').value;
            const dados1 = document.getElementById('dados1').value;
            const dados2 = document.getElementById('dados2').value;
            const dados3 = document.getElementById('dados3').value;
            const restaurante = document.getElementById('restaurante').value;

            const clienteData = {
                nome,
                endereco,
                telefone,
                numero_compras,
                dados1,
                dados2,
                dados3,
                restaurante
            };

            // Enviar dados para a API
            fetch('https://us-central1-SEU-PROJETO.cloudfunctions.net/api/adicionar-cliente', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(clienteData)
            })
            .then(response => response.json())
            .then(data => {
                console.log('Cliente adicionado com sucesso', data);
                alert('Cliente adicionado com sucesso!');
            })
            .catch((error) => {
                console.error('Erro ao adicionar cliente:', error);
                alert('Erro ao adicionar cliente');
            });
        });
    </script>
</body>
</html>
