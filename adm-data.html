<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Clientes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lista de Clientes</h1>
        
        <table id="tabela-clientes">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Endereço</th>
                    <th>Telefone</th>
                    <th>Número de Compras</th>
                    <th>Dados</th>
                </tr>
            </thead>
            <tbody>
                <!-- Clientes serão listados aqui -->
            </tbody>
        </table>
    </div>

    <script>
        // Função para listar os clientes na tabela
        async function listarClientes() {
            const response = await fetch('/listar-clientes');
            const clientes = await response.json();

            const tabela = document.getElementById('tabela-clientes').getElementsByTagName('tbody')[0];
            tabela.innerHTML = '';

            clientes.forEach(cliente => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${cliente.id}</td>
                    <td>${cliente.nome}</td>
                    <td>${cliente.endereco}</td>
                    <td>${cliente.telefone}</td>
                    <td>${cliente.numero_compras}</td>
                    <td>${cliente.dados1 || ''}, ${cliente.dados2 || ''}, ${cliente.dados3 || ''}</td>
                `;
                tabela.appendChild(row);
            });
        }

        // Chama a função para listar os clientes quando a página carregar
        window.onload = listarClientes;
    </script>

</body>
</html>
